name: Hotfix Deployment

on:
  push:
    branches:
      - hotfix/*
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests for emergency deployment'
        required: false
        default: false
        type: boolean

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE_PRODUCTION }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER_PRODUCTION }}
  ECS_TASK_DEFINITION: ${{ vars.ECS_TASK_DEFINITION_PRODUCTION }}
  CONTAINER_NAME: photoframix-frontend-stage

permissions:
  id-token: write
  contents: read

jobs:
  # Quick validation (can be skipped for emergency deployments)
  validate:
    name: Quick Validation
    runs-on: ubuntu-latest
    if: ${{ !github.event.inputs.skip_tests }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type check only
        run: npm run type-check

      - name: Quick build test
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1

  # Emergency deployment
  hotfix-deploy:
    name: Emergency Deploy
    runs-on: ubuntu-latest
    needs: validate
    if: always() && (needs.validate.result == 'success' || needs.validate.result == 'skipped')
    environment: 
      name: production
      url: https://photoframix.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          tags: |
            type=ref,event=branch,prefix=hotfix-
            type=sha,prefix=hotfix-{{branch}}-
            type=raw,value=hotfix-latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          build-args: |
            NODE_ENV=production
            NEXT_PUBLIC_BASE_URL=https://photoframix.com
            NEXT_PUBLIC_APP_NAME=PhotoFramix
            NEXT_PUBLIC_APP_VERSION=1.0.0
            NEXT_PUBLIC_API_URL=https://photoframix.com
            NEXT_PUBLIC_ENVIRONMENT=production
            NEXT_PUBLIC_ENABLE_DEBUG=false
            NEXT_PUBLIC_ENABLE_ANALYTICS=true
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=829564712055-nv247pdurodv3atd4jv24rsaom8qsscm.apps.googleusercontent.com
            NEXT_PUBLIC_IMAGEKIT_URL_ENDPOINT=https://ik.imagekit.io/hw5gjfx78
            NEXT_PUBLIC_PAYU_KEY=rGRiaJ
            NEXT_PUBLIC_PAYU_SALT=BEoQBAySdr3GiB413ZIp0ydW3UHeap8f

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition --task-definition ${{ env.ECS_TASK_DEFINITION }} --query taskDefinition > task-definition.json

      - name: Update task definition with new image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:hotfix-latest

      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Verify hotfix deployment
        run: |
          echo "🚨 HOTFIX DEPLOYMENT COMPLETED 🚨"
          echo "Service: ${{ env.ECS_SERVICE }}"
          echo "Cluster: ${{ env.ECS_CLUSTER }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          
          # Get the service status
          aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --query 'services[0].{ServiceName:serviceName,Status:status,RunningCount:runningCount,DesiredCount:desiredCount,TaskDefinition:taskDefinition}'

      - name: Post-deployment health check
        run: |
          echo "Waiting 30 seconds for application to stabilize..."
          sleep 30
          
          # Simple health check
          if command -v curl > /dev/null; then
            echo "Attempting health check..."
            # Note: Replace with your actual load balancer URL if available
            # curl -f https://photoframix.com/api/health || echo "Health check endpoint not accessible from GitHub Actions"
            echo "Health check completed (manual verification recommended)"
          fi

      - name: Create hotfix deployment notice
        run: |
          echo "## 🚨 Hotfix Deployment Notice" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**EMERGENCY DEPLOYMENT COMPLETED**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Detail | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Service | ${{ env.ECS_SERVICE }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Cluster | ${{ env.ECS_CLUSTER }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ✅ Deployed |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests Skipped | ${{ github.event.inputs.skip_tests || 'false' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ **Manual verification recommended after hotfix deployment**" >> $GITHUB_STEP_SUMMARY
